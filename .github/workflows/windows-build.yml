name: Build and test Windows EXE

# Manual only. No release, repository write, deployment, paid runner or secret.
on:
  workflow_dispatch:
    inputs:
      run_browser_test:
        description: 'Include actual-EXE Chromium UI screenshot (official Playwright download)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vga-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    # Standard GitHub-hosted runner only; this workflow targets the public repo.
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build requirements from official PyPI
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 reports/windows-build-environment.txt
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript checks
        run: |
          node --check static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/ocr-ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/choices.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_ui_logic.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_choices_ui.js
      - name: Test automatic window lifecycle and bounded capture on owned Windows fixtures
        run: python tests/windows_automatic_capture.py --reports reports
      - name: Verify exact-source overlay geometry at five app scales
        run: python tests/windows_dpi_matrix.py --implementation-file native_ui.py --support-root . --report-dir reports --expect candidate
      - name: Install and use approved free Community C++ runtime tooling
        run: ./scripts/install-community-runtime.ps1 -AcceptCommunityLicense
      - name: Build bounded HWND-only WGC helper
        run: python scripts/build_wgc_capture.py
      - name: Build persistent HWND-only WGC helper with the same approved compiler
        run: python scripts/build_wgc_session_capture.py
      - name: Build single-file EXE with local OCR models
        run: python scripts/build_windows.py
      - name: Install optional official browser test dependencies
        if: ${{ inputs.run_browser_test }}
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements-browser.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual EXE, verify local OCR and HTTP, take UI screenshot
        env:
          RUN_BROWSER_TEST: ${{ inputs.run_browser_test }}
        run: |
          $arguments = @('tests/windows_exe_smoke.py', '--exe', 'dist/VGA-Aram-Helper.exe')
          if ($env:RUN_BROWSER_TEST -eq 'true') { $arguments += '--browser' }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test actual native overlay against a synthetic mock window
        run: python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe
      - name: Repeat actual EXE native OCR and overlay at 150 percent app scale
        run: python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe --app-scale 1.5
      - name: Repeat actual EXE native OCR and overlay at 200 percent app scale
        run: python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe --app-scale 2
      - name: Test owned client-to-game screenshot selection handoff
        run: python tests/windows_selection_smoke.py --exe dist/VGA-Aram-Helper.exe
      - name: Check existing and proposed artifact storage before upload
        run: python scripts/check_artifact_budget.py
      - name: Upload tested executable, exact checksum and OTA manifest
        # This only stores a downloadable run artifact. It does not publish a release.
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: vga-aram-helper-windows-x64-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload test evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-evidence-${{ github.sha }}
          path: |
            reports/windows-*
            build/pyinstaller/VGA-Aram-Helper/warn-*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Write run summary
        if: ${{ always() }}
        run: |
          '## Windows EXE verification' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path reports/windows-exe-smoke.json) {
            Get-Content reports/windows-exe-smoke.json >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Actual EXE smoke test did not complete; do not treat this build as verified.' >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path dist/release/SHA256SUMS.txt) {
            Get-Content dist/release/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path reports/windows-native-smoke.json) {
            Get-Content reports/windows-native-smoke.json >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Native overlay verification did not complete; do not treat this build as verified.' >> $env:GITHUB_STEP_SUMMARY
          }
