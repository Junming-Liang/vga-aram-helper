name: Diagnose native Windows source and frozen transitions

# Manual source and one fresh EXE diagnostic by default. Explicit source-only
# focus/routing diagnostics never claim frozen acceptance. No publication.
on:
  workflow_dispatch:
    inputs:
      source_focus_only:
        description: 'Run all owned source focus/routing fixtures without an OpenCV rebuild or frozen EXE'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: vga-native-source-diagnostic
  cancel-in-progress: false

jobs:
  source-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.repository == 'Junming-Liang/vga-aram-helper' && github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      ORT_DISABLE_TELEMETRY: '1'
      VGA_RELEASE_PACKAGE_PROFILE: 'minimal-opencv-v1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      VGA_SOURCE_FOCUS_ONLY: ${{ toJSON(inputs.source_focus_only) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check diagnostic workflow safety contract
        run: python -m unittest discover -s tests -p 'test_native_source_diagnostic_workflow.py' -v
      - name: Require the exact dispatch checkout and fresh diagnostic outputs
        run: |
          if ($env:VGA_SOURCE_FOCUS_ONLY -cnotin @('true', 'false')) { throw 'Unknown diagnostic mode.' }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -cne $env:GITHUB_SHA) { throw 'Checkout differs from the exact dispatch SHA.' }
          if (Get-ChildItem reports/windows-* -File -ErrorAction SilentlyContinue) { throw 'Existing Windows evidence cannot be reused by this diagnostic.' }
          if (Test-Path dist/VGA-Aram-Helper.exe) { throw 'A fresh EXE must be built in this run.' }
          if (Test-Path build/native-frozen150-second) { throw 'Second frozen process output must be fresh.' }
          if (Test-Path build/native-source-diagnostic-evidence) { throw 'Diagnostic staging must be fresh.' }
          New-Item -ItemType Directory -Force reports | Out-Null
      - name: Install pinned build requirements from official PyPI
        timeout-minutes: 8
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 reports/windows-native-source-diagnostic-environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and use approved free Community C++ runtime tooling
        timeout-minutes: 22
        run: ./scripts/install-community-runtime.ps1 -AcceptCommunityLicense
      - name: Build bounded HWND-only WGC helper with approved compiler
        timeout-minutes: 4
        run: python scripts/build_wgc_capture.py
      - name: Build persistent HWND-only WGC helper with the same approved compiler
        timeout-minutes: 4
        run: python scripts/build_wgc_session_capture.py
      - name: Require source-only real WGC acceptance at three app scales
        id: focus_wgc
        if: ${{ inputs.source_focus_only }}
        timeout-minutes: 6
        run: python tests/windows_wgc_capture.py --reports reports
      - name: Require source-only application session acceptance at three app scales
        id: focus_session
        if: ${{ inputs.source_focus_only }}
        timeout-minutes: 8
        run: python tests/windows_wgc_session_capture.py --application --reports reports
      - name: Require source-only visible-overlay capture at three app scales
        id: focus_visible
        if: ${{ inputs.source_focus_only }}
        timeout-minutes: 10
        run: python tests/windows_wgc_visible_overlay.py --reports reports
      - name: Require source selection handoff at three app scales
        id: focus_selection
        timeout-minutes: 8
        run: python tests/windows_selection_smoke.py --report-dir reports
      - name: Require source automatic owned window lifecycle
        id: focus_automatic
        timeout-minutes: 6
        run: python tests/windows_automatic_capture.py --reports reports
      - name: Require source-only exact-source geometry at five app scales
        id: focus_geometry
        if: ${{ inputs.source_focus_only }}
        timeout-minutes: 6
        run: python tests/windows_dpi_matrix.py --implementation-file native_ui.py --support-root . --report-dir reports --expect candidate
      - name: Diagnose source native transitions at 150 percent first
        id: focus_native150
        timeout-minutes: 6
        run: python tests/windows_native_smoke.py --source --app-scale 1.5
      - name: Require source native transitions at 100 percent after 150 passes
        id: focus_native100
        timeout-minutes: 6
        run: python tests/windows_native_smoke.py --source
      - name: Require source native transitions at 200 percent after earlier scales pass
        id: focus_native200
        timeout-minutes: 6
        run: python tests/windows_native_smoke.py --source --app-scale 2
      - name: Bind every required source-only result without claiming frozen acceptance
        if: ${{ inputs.source_focus_only }}
        env:
          VGA_FOCUS_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          @'
          """Bind completed owned source fixtures only; never frozen/release acceptance."""
          import hashlib
          import importlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import sys

          ROOT = Path.cwd().resolve()
          sys.path.insert(0, str(ROOT))
          sys.path.insert(0, str(ROOT / 'tests'))
          RESULT = 'reports/windows-source-focus-diagnostic-result.json'
          STEP_IDS = ('focus_wgc', 'focus_session', 'focus_visible', 'focus_selection',
                      'focus_automatic', 'focus_geometry', 'focus_native150', 'focus_native100', 'focus_native200')
          CASES = (('windows_wgc_capture', 'windows-wgc-source', 'source_files'),
                   ('windows_wgc_session_capture', 'windows-wgc-session-application-source', 'source_files'),
                   ('windows_wgc_visible_overlay', 'windows-wgc-visible-overlay-source', 'source_files'),
                   ('windows_selection_smoke', 'windows-selection-source', 'source_files'),
                   ('windows_automatic_capture', 'windows-automatic-capture', 'source_sha256'))
          CONFIG_INPUTS = ('.github/workflows/diagnose-native-source.yml',
                           'tests/test_native_source_diagnostic_workflow.py', 'app_version.py',
                           'requirements-build.txt', 'requirements-ocr.txt', 'packaging/windows-build-constraints.txt',
                           'tests/windows_dpi_matrix.py', 'tests/windows_native_smoke.py')
          SCOPE = ('Owned synthetic Windows source focus/routing diagnostics only. '
                   'No frozen EXE was built or tested; not complete release acceptance or real-game evidence. '
                   'Geometry is source layout coverage. OpenCV profiling and the historical GUI walkthrough are outside this mode.')


          def require(value, message):
              if not value:
                  raise RuntimeError(message)


          def record(relative):
              path = ROOT / relative
              require(not path.is_symlink() and path.is_file(), 'Missing or symbolic diagnostic file: ' + relative)
              data = path.read_bytes()
              return dict(size=len(data), sha256=hashlib.sha256(data).hexdigest())


          def read(relative):
              path = ROOT / relative
              require(not path.is_symlink() and path.is_file() and path.stat().st_size <= 256 * 1024,
                      'Missing, symbolic or oversized source report: ' + relative)
              def unique(pairs):
                  value = {}
                  for key, item in pairs:
                      require(key not in value, 'Duplicate source report key')
                      value[key] = item
                  return value
              def invalid(value):
                  raise RuntimeError('Non-finite source report value')
              def finite_float(text):
                  value = float(text)
                  require(math.isfinite(value), 'Non-finite source report value')
                  return value
              value = json.loads(path.read_text(encoding='utf-8-sig'), object_pairs_hook=unique,
                                 parse_constant=invalid, parse_float=finite_float)
              require(type(value) is dict, 'Source report must be an object')
              return value


          def complete_source_focus():
              require(os.environ.get('VGA_SOURCE_FOCUS_ONLY') == 'true', 'Source-only completion requires explicit source-only mode')
              sha = os.environ.get('GITHUB_SHA', '')
              require(bool(re.fullmatch('[0-9a-f]{40}', sha)), 'Invalid dispatch SHA')
              require(os.environ.get('GITHUB_REPOSITORY') == 'Junming-Liang/vga-aram-helper', 'Wrong repository')
              require(os.environ.get('VGA_RELEASE_PACKAGE_PROFILE') == 'minimal-opencv-v1', 'Wrong active build profile')
              for field in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'):
                  require(bool(re.fullmatch('[1-9][0-9]*', os.environ.get(field, ''))), 'Invalid diagnostic run identity')
              outcomes = json.loads(os.environ.get('VGA_FOCUS_STEP_RESULTS', '{}'))
              require(type(outcomes) is dict and all(type(outcomes.get(key)) is dict and
                      outcomes[key].get('outcome') == 'success' for key in STEP_IDS),
                      'Every required source step must have succeeded in this run')
              for name in ('dist/VGA-Aram-Helper.exe', 'reports/windows-build.json',
                           'reports/windows-native-diagnostic-identity.json', 'reports/windows-native-diagnostic-result.json'):
                  require(not (ROOT / name).exists() and not (ROOT / name).is_symlink(),
                          'Source-only mode cannot contain frozen build/proof: ' + name)
              from app_version import __version__ as version
              from scripts.build_windows import verify_source_checkout
              require(verify_source_checkout(ROOT, sha) == sha, 'Checkout differs from dispatch SHA')
              files, sources = {}, {name: record(name)['sha256'] for name in CONFIG_INPUTS}
              def report(name, status='passed'):
                  relative = 'reports/' + name + '.json'
                  value = read(relative)
                  require(value.get('status') == status and 'error' not in value, 'Required source report did not pass: ' + name)
                  files[relative] = record(relative)
                  return value
              def source_identity(value, names, field='source_files', version_field='applicationVersion'):
                  expected = {name: record(name)['sha256'] for name in names}
                  require(value.get(field) == expected and value.get('source_commit') == sha and
                          value.get(version_field) == version and value.get('frozen') is False and
                          value.get('executable_sha256') is None and 'executable_size' not in value,
                          'Source report identity/bytes/mode differ')
                  sources.update(expected)
              helpers = {kind: report('windows-wgc' + suffix + '-build')
                         for kind, suffix in (('wgc', ''), ('session', '-session'))}
              require(all(value.get('source_commit') == sha for value in helpers.values()), 'Helper dispatch SHA differs')
              for module_name, prefix, source_field in CASES:
                  module = importlib.import_module(module_name)
                  value = report(prefix)
                  source_identity(value, module.SOURCE_FILES, source_field,
                                  'application_version' if source_field == 'source_sha256' else 'applicationVersion')
                  if module_name == 'windows_automatic_capture':
                      module.validate_source_report(value, version, sha)
                      require(value.get('platform') == 'win32' and value.get('checks_use_real_windows') is True,
                              'Automatic lifecycle was not actual Windows source execution')
                      continue
                  scales, runs = value.get('scales'), value.get('runs')
                  require(type(scales) is list and all(type(scale) in (int, float) for scale in scales) and
                          scales == [1, 1.5, 2] and type(runs) is list and len(runs) == 3,
                          'All three ordered source scales are required')
                  if module_name == 'windows_wgc_session_capture':
                      module.validate_acceptance(value, frozen=False, application=True, helper_build=helpers['session'],
                                                 source_commit=sha, version=version)
                  elif module_name == 'windows_wgc_visible_overlay':
                      require(value.get('helper_build') == helpers['session'], 'Visible-overlay helper proof differs')
                  elif module_name == 'windows_selection_smoke':
                      module.validate_aggregate(value, version, frozen=False, source_commit=sha)
                  for scale, row in zip(scales, runs):
                      scale_key = 'scale' if module_name == 'windows_wgc_visible_overlay' else 'app_scale'
                      require(type(row) is dict and type(row.get(scale_key)) in (int, float) and row[scale_key] == scale,
                              'Source scale row differs')
                      name = (module.native_report_name(False, scale)[:-5] if module_name == 'windows_selection_smoke'
                              else prefix + '-scale' + str(round(scale * 100)))
                      detail = report(name)
                      require(detail.get('frozen') is False and detail.get('applicationVersion') == version,
                              'Child source mode/version differs')
                      if module_name == 'windows_wgc_visible_overlay':
                          require(row.get('coordination') == 'passed' and type(row.get('exit_code')) is int and
                                  row['exit_code'] == 0 and row.get('outer_cleanup_complete') is True and
                                  not any(key in row for key in ('coordination_error', 'outer_cleanup_errors', 'detail_error', 'report_binding_error')),
                                  'Visible-overlay owned process coordination/cleanup did not pass')
                          require(module.read_bound_detail(row, ROOT / 'reports', frozen=False) == detail,
                                  'Visible-overlay bound source report differs')
                          module.validate_report(detail, scale=scale, frozen=False, helper=helpers['session'],
                              foreign_proof=row.get('foreign'), foreign_fixture_sha256=value['foreign_fixture']['executable_sha256'])
                      else:
                          require(row.get('detail') == detail, 'Child source report differs from aggregate')
                          if module_name == 'windows_wgc_capture':
                              require(value.get('helper_build') == helpers['wgc'], 'WGC helper proof differs')
                              module.validate_report(detail, frozen=False, scale=scale, helper_build=helpers['wgc'])
                          if module_name == 'windows_selection_smoke':
                              require(row.get('native_report_sha256') == files['reports/' + name + '.json']['sha256'],
                                      'Selection handoff bytes differ')
              dpi = importlib.import_module('windows_dpi_matrix')
              geometry = report('windows-dpi-candidate-matrix', 'candidate_passed')
              require(geometry.get('expect') == 'candidate' and geometry.get('gate_errors') == [] and
                      dpi.validate_matrix(geometry, 'candidate') == [] and
                      geometry.get('source_metadata') == dpi.source_metadata(ROOT / 'native_ui.py', ROOT),
                      'Exact-source five-scale geometry proof differs')
              for scale, child in zip(dpi.SCALES, geometry['children']):
                  detail = report('windows-dpi-candidate-scale-' + scale, 'completed')
                  expected = {key: value for key, value in child.items() if key not in ('process_exit_code', 'timed_out')}
                  require(detail == expected and detail.get('frozen') is False and detail.get('qt_scale_factor') == scale,
                          'Geometry child source report differs from aggregate')
              from overlay_duty_contract import SOURCE_FILES
              native = importlib.import_module('windows_native_smoke')
              for prefix, scale in (('windows-native-source-scale150', 1.5), ('windows-native-source', 1),
                                    ('windows-native-source-scale200', 2)):
                  value = report(prefix + '-smoke')
                  source_identity(value, SOURCE_FILES)
                  require(type(value.get('requested_app_scale')) in (int, float) and value['requested_app_scale'] == scale and
                          value.get('process_exited') is True and value.get('native_report') == prefix + '-overlay.json',
                          'Native source scale/process/report differs')
                  detail = report(prefix + '-overlay')
                  require(value.get('native_report_sha256') == files['reports/' + prefix + '-overlay.json']['sha256'],
                          'Native source overlay bytes differ')
                  native.validate_manual_hero_switches(value.get('manual_hero_switches'))
                  native.validate_report(detail, version, scale, expected_frozen=False)
              files['reports/windows-native-source-diagnostic-environment.txt'] = record('reports/windows-native-source-diagnostic-environment.txt')
              result = dict(status='passed', mode='source-focus-only', scope=SCOPE, source_sha=sha,
                            version=version, run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                            required_steps={key: 'success' for key in STEP_IDS}, source_files=sources,
                            reports=files, frozen_executable_tested=False, release_acceptance=False)
              raw = (json.dumps(result, indent=2) + '\n').encode('utf-8')
              require(len(raw) <= 256 * 1024, 'Source-only completion exceeds its cap')
              with (ROOT / RESULT).open('xb') as output:
                  output.write(raw)
              print(raw.decode('utf-8'), flush=True)
              return result


          if __name__ == '__main__':
              complete_source_focus()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the exact official wheel and initial identity before rebuilding
        if: ${{ !inputs.source_focus_only }}
        run: |
          New-Item -ItemType Directory -Force build/opencv-postbuild/official | Out-Null
          python -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --no-deps --dest build/opencv-postbuild/official opencv-python-headless==5.0.0.93
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe_opencv_postbuild.py prepare
      - name: Rebuild adopted hash-pinned OpenCV with the approved Community compiler
        if: ${{ !inputs.source_focus_only }}
        run: python scripts/build_minimal_opencv.py
      - name: Compare one fixed official-to-custom pair after the build and restore exact custom bytes
        if: ${{ !inputs.source_focus_only }}
        run: |
          python scripts/probe_opencv_postbuild.py run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe_opencv_postbuild.py export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 reports/windows-build-environment.txt
      - name: Build one fresh single-file EXE with the normal package gates
        if: ${{ !inputs.source_focus_only }}
        run: python scripts/build_windows.py
      - name: Bind the fresh EXE to source environment profile and build proof
        if: ${{ !inputs.source_focus_only }}
        run: |
          @'
          """Read-only bindings for this fixed source/frozen diagnostic, never release approval."""
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import sys
          import zipfile

          ROOT = Path.cwd().resolve()
          sys.path.insert(0, str(ROOT))
          sys.path.insert(0, str(ROOT / 'tests'))
          PROFILE = 'minimal-opencv-v1'
          IDENTITY = 'reports/windows-native-diagnostic-identity.json'
          RESULT = 'reports/windows-native-diagnostic-result.json'
          SELECTION_RECEIPT = 'reports/windows-frozen-selection-diagnostic.json'
          CASES = (
              ('frozen150-first', 'reports', 'windows-native-scale150', 1.5),
              ('frozen150-second', 'build/native-frozen150-second/reports', 'windows-native-scale150', 1.5),
              ('frozen100', 'reports', 'windows-native', 1.0),
              ('frozen200', 'reports', 'windows-native-scale200', 2.0),
          )
          SOURCE_CASES = (('reports', 'windows-native-source-scale150', 1.5),
                          ('reports', 'windows-native-source', 1.0),
                          ('reports', 'windows-native-source-scale200', 2.0))
          REQUIRED_STEPS = ('focus_selection', 'focus_automatic', 'focus_native150', 'focus_native100', 'focus_native200',
                            'frozen_selection', 'frozen_native150_first', 'frozen_native150_second', 'frozen_native100', 'frozen_native200')
          CONFIG_INPUTS = ('.github/workflows/diagnose-native-source.yml',
                           'tests/test_native_source_diagnostic_workflow.py',
                           'app_version.py', 'capture_cadence.py', 'requirements-build.txt',
                           'requirements-ocr.txt', 'packaging/windows-build-constraints.txt',
                           'packaging/VGA-Aram-Helper.spec', 'scripts/build_windows.py',
                           'tests/windows_ota_smoke.py', 'tests/windows_exe_smoke.py')
          SCOPE = ('Owned synthetic source/frozen capture diagnostics for one fresh EXE. '
                   'Not complete release acceptance or proof of the original Run 80 cause. '
                   'Selection/controller ownership is tested from source and this EXE at three scales; '
                   'automatic window lifecycle is tested from source only.')


          def require(value, message):
              if not value:
                  raise RuntimeError(message)


          def file_record(relative):
              path = ROOT / relative
              require(not path.is_symlink() and path.is_file(), 'Missing or symbolic bound file: ' + relative)
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              return dict(size=path.stat().st_size, sha256=digest)


          def read_json(relative):
              path = ROOT / relative
              require(not path.is_symlink() and path.is_file() and path.stat().st_size <= 4 * 1024 * 1024,
                      'Missing, symbolic or oversized JSON: ' + relative)
              def unique(pairs):
                  value = {}
                  for key, item in pairs:
                      require(key not in value, 'Duplicate diagnostic JSON key')
                      value[key] = item
                  return value
              def invalid(value):
                  raise RuntimeError('Non-finite diagnostic JSON value')
              def finite_float(text):
                  value = float(text)
                  require(math.isfinite(value), 'Non-finite diagnostic JSON value')
                  return value
              value = json.loads(path.read_text(encoding='utf-8-sig'), object_pairs_hook=unique,
                                 parse_constant=invalid, parse_float=finite_float)
              require(type(value) is dict, 'JSON must be an object: ' + relative)
              return value


          def write_new(relative, value):
              raw = (json.dumps(value, indent=2) + '\n').encode('utf-8')
              require(len(raw) <= 256 * 1024, 'Diagnostic binding exceeds its 256 KiB cap')
              with (ROOT / relative).open('xb') as stream:
                  stream.write(raw)


          def expected_source():
              require(os.environ.get('VGA_SOURCE_FOCUS_ONLY') == 'false', 'Full EXE proof requires explicit full diagnostic mode')
              sha = os.environ.get('GITHUB_SHA', '')
              require(bool(re.fullmatch('[0-9a-f]{40}', sha)), 'Invalid dispatch SHA')
              require(os.environ.get('GITHUB_REPOSITORY') == 'Junming-Liang/vga-aram-helper', 'Wrong repository')
              require(os.environ.get('VGA_RELEASE_PACKAGE_PROFILE') == PROFILE, 'Wrong active build profile')
              from scripts.build_windows import verify_source_checkout
              require(verify_source_checkout(ROOT, sha) == sha, 'Checkout differs from dispatch SHA')
              return sha


          def source_hashes():
              from overlay_duty_contract import SOURCE_FILES
              from scripts.probe_opencv_postbuild import SOURCE_FILES as BUILD_INPUTS
              from windows_selection_smoke import SOURCE_FILES as SELECTION_INPUTS
              from windows_automatic_capture import SOURCE_FILES as AUTOMATIC_INPUTS
              names = set(SOURCE_FILES) | set(BUILD_INPUTS) | set(CONFIG_INPUTS) | set(SELECTION_INPUTS) | set(AUTOMATIC_INPUTS)
              return {name: file_record(name)['sha256'] for name in sorted(names)}


          def duty_inputs():
              from overlay_duty_contract import SOURCE_FILES
              return SOURCE_FILES


          def postbuild_proof():
              from scripts.probe_opencv_postbuild import validate_export, EVIDENCE_NAMES, EXPORT_NAMES
              bundle, receipt = validate_export()
              require(bundle['status'] == 'completed' and receipt['status'] == 'passed', 'Post-build comparison/restoration gate failed')
              return tuple('reports/' + name for name in (*EVIDENCE_NAMES, *EXPORT_NAMES.values()))


          def verify_case(directory, prefix, scale, identity, *, frozen):
              path = directory + '/' + prefix + '-smoke.json'
              report = read_json(path)
              require(report.get('status') == 'passed' and 'error' not in report and report.get('frozen') is frozen,
                      'Failed or wrong execution mode: ' + path)
              require(report.get('source_commit') == identity['source_sha'] and
                      report.get('applicationVersion') == identity['version'] and
                      type(report.get('requested_app_scale')) in (int, float) and
                      report.get('requested_app_scale') == scale and report.get('process_exited') is True,
                      'Wrong source/version/scale/process completion: ' + path)
              expected = {name: identity['source_files'][name] for name in duty_inputs()}
              require(report.get('source_files') == expected, 'Report source bytes differ: ' + path)
              require(report.get('manual_hero_switches') == dict(required=8, attempted=8, completed=8) and
                      all(type(v) is int for v in report['manual_hero_switches'].values()),
                      'Eight independent manual switches did not pass: ' + path)
              require(report.get('executable_sha256') == (identity['exe']['sha256'] if frozen else None),
                      'Report tested a different EXE: ' + path)
              if frozen:
                  require(report.get('executable_size') == identity['exe']['size'], 'Report EXE size differs: ' + path)
              native_name = prefix + '-overlay.json'
              require(report.get('native_report') == native_name and
                      report.get('native_report_sha256') == file_record(directory + '/' + native_name)['sha256'],
                      'Native result bytes differ: ' + path)
              return dict(report=path, **file_record(path), frozen=frozen, app_scale=scale, manual_switches=8)


          def selection_names(frozen):
              require(type(frozen) is bool, 'Selection execution mode must be explicit')
              prefix = 'windows-selection-handoff' if frozen else 'windows-selection-source-handoff'
              return (('windows-selection-smoke.json' if frozen else 'windows-selection-source.json'),
                      prefix + '.json', prefix + '-scale150.json', prefix + '-scale200.json')


          def verify_selection(identity, *, frozen):
              from windows_selection_smoke import SOURCE_FILES, validate_aggregate
              names = selection_names(frozen)
              aggregate_path = 'reports/' + names[0]
              report = read_json(aggregate_path)
              expected = {name: identity['source_files'][name] for name in SOURCE_FILES}
              require(report.get('status') == 'passed' and 'error' not in report and report.get('frozen') is frozen
                      and report.get('source_commit') == identity['source_sha'] and report.get('applicationVersion') == identity['version']
                      and report.get('source_files') == expected, 'Selection source/mode/status/bytes differ')
              if frozen:
                  require(report.get('executable_sha256') == identity['exe']['sha256']
                          and type(report.get('executable_size')) is int and report['executable_size'] == identity['exe']['size'],
                          'Selection tested a different EXE')
              else:
                  require('executable_sha256' not in report and 'executable_size' not in report,
                          'Source selection cannot claim frozen EXE bytes')
              validate_aggregate(report, identity['version'], frozen=frozen, source_commit=identity['source_sha'],
                  executable_sha256=identity['exe']['sha256'] if frozen else None,
                  executable_size=identity['exe']['size'] if frozen else None)
              scales, runs = report.get('scales'), report.get('runs')
              require(type(scales) is list and all(type(scale) in (int, float) for scale in scales) and scales == [1, 1.5, 2]
                      and type(runs) is list and len(runs) == 3, 'Selection requires all three ordered scale runs')
              files = {aggregate_path: file_record(aggregate_path)}
              for scale, name, row in zip(scales, names[1:], runs):
                  path = 'reports/' + name
                  require(type(row) is dict and type(row.get('app_scale')) in (int, float) and row['app_scale'] == scale
                          and row.get('native_report') == name, 'Selection fixed scale/report identity differs')
                  detail = read_json(path)
                  files[path] = file_record(path)
                  require(row.get('detail') == detail and row.get('native_report_sha256') == files[path]['sha256'],
                          'Selection raw handoff evidence differs')
              return dict(frozen=frozen, source_sha=identity['source_sha'], scales=scales, files=files)


          def verify_source_controller(identity):
              from windows_automatic_capture import SOURCE_FILES, validate_source_report
              path = 'reports/windows-automatic-capture.json'
              automatic = read_json(path)
              validate_source_report(automatic, identity['version'], identity['source_sha'])
              require(automatic.get('source_sha256') == {name: identity['source_files'][name] for name in SOURCE_FILES},
                      'Automatic source bytes differ')
              return dict(selection=verify_selection(identity, frozen=False),
                          automatic=dict(report=path, **file_record(path), frozen=False))


          def record_identity():
              sha = expected_source()
              from app_version import __version__ as version
              proof_files = postbuild_proof()
              build = read_json('reports/windows-build.json')
              require(build.get('status') == 'built-not-yet-smoke-tested' and build.get('source_commit') == sha
                      and build.get('version') == version and build.get('package_profile') == PROFILE
                      and build.get('experimental') is False, 'Build source/version/profile identity differs')
              custom = build.get('opencv_custom_build', {})
              require(custom.get('status') == 'passed' and custom.get('source_commit') == sha
                      and custom.get('package_profile') == PROFILE, 'Custom OpenCV build proof differs')
              manifest = read_json('dist/release/update-manifest.json')
              exe = file_record('dist/VGA-Aram-Helper.exe')
              require(build.get('manifest') == manifest and manifest.get('version') == version
                      and all(manifest.get(key) == exe[key] for key in ('size', 'sha256')),
                      'Fresh EXE differs from build receipt/manifest')
              named = 'dist/release/vga-aram-helper-' + version + '-windows-x64.exe'
              require(file_record(named) == exe, 'Named EXE copy differs from the one tested')
              access = read_json('dist/release/source-access.json')
              archive = 'dist/release/vga-aram-helper-' + version + '-source.zip'
              archive_record = file_record(archive)
              require(access == build.get('source_access') and access.get('source_commit') == sha
                      and access.get('application_source') == dict(filename=Path(archive).name, **archive_record),
                      'Source archive differs from the build receipt')
              with zipfile.ZipFile(ROOT / archive) as source:
                  require(source.comment == sha.encode('ascii'), 'Source archive commit differs')
              identity = dict(scope=SCOPE, mode='source-and-frozen', source_sha=sha, version=version, profile=PROFILE,
                              exe=exe, source_archive=archive_record, source_files=source_hashes(),
                              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])
              source_results = [verify_case(directory, prefix, scale, identity, frozen=False)
                                for directory, prefix, scale in SOURCE_CASES]
              fixed_files = (*proof_files, 'reports/windows-build.json',
                             'reports/windows-wgc-build.json', 'reports/windows-wgc-session-build.json',
                             'reports/windows-native-source-diagnostic-environment.txt',
                             'reports/windows-build-environment.txt', 'dist/release/update-manifest.json',
                             'dist/release/source-access.json', 'dist/release/SHA256SUMS.txt', named, archive)
              identity['bound_files'] = {name: file_record(name) for name in fixed_files}
              identity['source_results'] = source_results
              identity['source_controller'] = verify_source_controller(identity)
              write_new(IDENTITY, identity)
              print(json.dumps(identity, indent=2), flush=True)
              return identity


          def fixed_bound_names(version):
              from scripts.probe_opencv_postbuild import EVIDENCE_NAMES, EXPORT_NAMES
              return set(tuple('reports/' + name for name in (*EVIDENCE_NAMES, *EXPORT_NAMES.values())) + (
                  'reports/windows-build.json', 'reports/windows-wgc-build.json',
                  'reports/windows-wgc-session-build.json',
                  'reports/windows-native-source-diagnostic-environment.txt',
                  'reports/windows-build-environment.txt', 'dist/release/update-manifest.json',
                  'dist/release/source-access.json', 'dist/release/SHA256SUMS.txt',
                  'dist/release/vga-aram-helper-' + version + '-windows-x64.exe',
                  'dist/release/vga-aram-helper-' + version + '-source.zip'))


          def check_identity():
              identity = read_json(IDENTITY)
              from app_version import __version__ as version
              require(identity.get('version') == version, 'Diagnostic version changed')
              require(identity.get('mode') == 'source-and-frozen', 'Full EXE diagnostic mode changed')
              require(identity.get('source_sha') == expected_source() and identity.get('profile') == PROFILE
                      and identity.get('run_id') == os.environ['GITHUB_RUN_ID']
                      and identity.get('run_attempt') == os.environ['GITHUB_RUN_ATTEMPT'], 'Diagnostic source/run/profile changed')
              require(identity.get('source_files') == source_hashes(), 'Source/configuration bytes changed')
              require(identity.get('exe') == file_record('dist/VGA-Aram-Helper.exe'), 'Fresh EXE bytes changed')
              require(type(identity.get('bound_files')) is dict and set(identity['bound_files']) == fixed_bound_names(version),
                      'Bound proof inventory changed')
              current_source = [verify_case(directory, prefix, scale, identity, frozen=False)
                                for directory, prefix, scale in SOURCE_CASES]
              require(identity.get('source_results') == current_source, 'Source diagnostic evidence changed')
              require(identity.get('source_controller') == verify_source_controller(identity), 'Source controller evidence changed')
              for name, record in identity['bound_files'].items():
                  require(file_record(name) == record, 'Bound build/environment/proof bytes changed: ' + name)
              return identity


          def before_selection():
              identity = check_identity()
              for name in (*selection_names(True), Path(SELECTION_RECEIPT).name):
                  path = ROOT / 'reports' / name
                  for output in (path, path.with_suffix('.tmp')):
                      require(not output.exists() and not output.is_symlink(), 'Selection output reuse rejected: ' + output.name)
              print(json.dumps(dict(case='frozen-selection', source_sha=identity['source_sha'], exe=identity['exe']), indent=2), flush=True)


          def selection_receipt(identity):
              return dict(mode='frozen-selection', source_sha=identity['source_sha'], exe=identity['exe'],
                          run_id=identity['run_id'], run_attempt=identity['run_attempt'],
                          identity_file=file_record(IDENTITY), selection=verify_selection(identity, frozen=True))


          def record_selection():
              receipt = selection_receipt(check_identity())
              write_new(SELECTION_RECEIPT, receipt)
              return receipt


          def check_selection(identity):
              receipt = read_json(SELECTION_RECEIPT)
              require(receipt == selection_receipt(identity), 'Frozen selection evidence or receipt changed')
              return receipt['selection']


          def before_case(label):
              require(label in [case[0] for case in CASES], 'Unknown fixed diagnostic case')
              identity = check_identity()
              check_selection(identity)
              for name, directory, prefix, scale in CASES:
                  if name == label:
                      for suffix in ('smoke.json', 'overlay.json', 'overlay.png', 'process.log', 'last-launch-error.txt'):
                          path = ROOT / directory / (prefix + '-' + suffix)
                          require(not path.exists() and not path.is_symlink(), 'Diagnostic output reuse rejected: ' + label)
                      print(json.dumps(dict(case=label, source_sha=identity['source_sha'], exe=identity['exe']), indent=2), flush=True)
                      return
                  verify_case(directory, prefix, scale, identity, frozen=True)


          def verify_all():
              identity = check_identity()
              outcomes = json.loads(os.environ.get('VGA_FULL_STEP_RESULTS', '{}'))
              require(type(outcomes) is dict and all(type(outcomes.get(key)) is dict and
                      outcomes[key].get('outcome') == 'success' for key in REQUIRED_STEPS),
                      'Every required source/frozen diagnostic step must have succeeded in this run')
              selection = check_selection(identity)
              rows = [dict(case=name, **verify_case(directory, prefix, scale, identity, frozen=True))
                      for name, directory, prefix, scale in CASES]
              result = dict(status='passed', scope=SCOPE, mode='source-and-frozen', source_sha=identity['source_sha'],
                            exe=identity['exe'], runs=rows, frozen_manual_switches=32,
                            source_manual_switches=24, frozen_selection=selection,
                            frozen_selection_receipt=file_record(SELECTION_RECEIPT),
                            source_controller=identity['source_controller'], automatic_frozen_tested=False,
                            required_steps={key: 'success' for key in REQUIRED_STEPS}, identity_file=file_record(IDENTITY))
              write_new(RESULT, result)
              print(json.dumps(result, indent=2), flush=True)
              return result


          if __name__ == '__main__':
              if sys.argv[1:] == ['record']:
                  record_identity()
              elif sys.argv[1:] == ['before-selection']:
                  before_selection()
              elif sys.argv[1:] == ['record-selection']:
                  record_selection()
              elif len(sys.argv) == 3 and sys.argv[1] == 'before':
                  before_case(sys.argv[2])
              elif sys.argv[1:] == ['verify']:
                  verify_all()
              else:
                  raise SystemExit('Expected only record, before-selection, record-selection, before FIXED_CASE, or verify')
          '@ | Set-Content -Encoding utf8 build/native-diagnostic-bindings.py
          python build/native-diagnostic-bindings.py record
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require the same fresh EXE selection and controller ownership at three app scales
        id: frozen_selection
        if: ${{ !inputs.source_focus_only }}
        timeout-minutes: 8
        run: |
          python build/native-diagnostic-bindings.py before-selection
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_selection_smoke.py --exe dist/VGA-Aram-Helper.exe --report-dir reports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/native-diagnostic-bindings.py record-selection
      - name: Require the same fresh EXE at 150 percent first
        id: frozen_native150_first
        if: ${{ !inputs.source_focus_only }}
        timeout-minutes: 6
        run: |
          python build/native-diagnostic-bindings.py before frozen150-first
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe --app-scale 1.5
      - name: Require the same fresh EXE at 150 percent in a second fresh process after the first passes
        id: frozen_native150_second
        if: ${{ !inputs.source_focus_only }}
        timeout-minutes: 6
        run: |
          python build/native-diagnostic-bindings.py before frozen150-second
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe --app-scale 1.5 --report-dir build/native-frozen150-second/reports
      - name: Require the same fresh EXE at 100 percent after both 150 percent processes pass
        id: frozen_native100
        if: ${{ !inputs.source_focus_only }}
        timeout-minutes: 6
        run: |
          python build/native-diagnostic-bindings.py before frozen100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe
      - name: Require the same fresh EXE at 200 percent after every earlier process passes
        id: frozen_native200
        if: ${{ !inputs.source_focus_only }}
        timeout-minutes: 6
        run: |
          python build/native-diagnostic-bindings.py before frozen200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe --app-scale 2
      - name: Verify exact-EXE selection and all four native results against unchanged source and proof
        if: ${{ !inputs.source_focus_only }}
        env:
          VGA_FULL_STEP_RESULTS: ${{ toJSON(steps) }}
        run: python build/native-diagnostic-bindings.py verify
      - name: Always print the full bounded post-build comparison and restoration summary
        if: ${{ always() && !inputs.source_focus_only }}
        run: |
          python scripts/probe_opencv_postbuild.py summarize | Tee-Object -FilePath reports/windows-opencv-postbuild-summary.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Always print and stage bounded current-run capture diagnostics
        id: diagnostic_evidence
        if: ${{ always() }}
        run: |
          @'
          # BEGIN BOUNDED_DIAGNOSTIC_EVIDENCE
          import hashlib
          import json
          import os
          from pathlib import Path

          REPORTS = Path('reports')
          STAGE = Path('build/native-source-diagnostic-evidence/reports')
          MAX_FILE_BYTES = 256 * 1024
          MAX_TOTAL_BYTES = 2 * 1024 * 1024
          MAX_PRINT_CHARS = 16000
          PREFIXES = ('windows-native-source-scale150', 'windows-native-source', 'windows-native-source-scale200',
                      'windows-native-scale150', 'windows-native', 'windows-native-scale200')
          SUFFIXES = ('smoke.json', 'overlay.json', 'process.log', 'last-launch-error.txt')
          FOCUS_PREFIXES = ('windows-wgc-source', 'windows-wgc-session-application-source',
                            'windows-wgc-visible-overlay-source')
          FOCUS_NAMES = tuple(prefix + suffix + '.json' for prefix in FOCUS_PREFIXES
                              for suffix in ('', '-scale100', '-scale150', '-scale200')) + (
              'windows-selection-source.json', 'windows-selection-source-handoff.json',
              'windows-selection-source-handoff-scale150.json', 'windows-selection-source-handoff-scale200.json',
              'windows-selection-smoke.json', 'windows-selection-handoff.json',
              'windows-selection-handoff-scale150.json', 'windows-selection-handoff-scale200.json',
              'windows-frozen-selection-diagnostic.json',
              'windows-automatic-capture.json', 'windows-dpi-candidate-matrix.json',
              'windows-source-focus-diagnostic-result.json') + tuple(
                  'windows-dpi-candidate-scale-' + scale + '.json' for scale in ('1', '1.25', '1.5', '2', '2.5'))
          NAMES = tuple(prefix + '-' + suffix for prefix in PREFIXES for suffix in SUFFIXES) + (
              'windows-wgc-build.json', 'windows-wgc-session-build.json',
              'windows-native-source-diagnostic-environment.txt', 'windows-build-environment.txt',
              'windows-build.json', 'windows-package-size.json', 'windows-opencv-build.json',
              'windows-opencv-intermediate-audit.json', 'windows-opencv-postbuild-summary.json',
              'windows-opencv-postbuild-result.json', 'windows-opencv-postbuild-export.json',
              'windows-opencv-parity.json', 'windows-native-diagnostic-identity.json',
              'windows-native-diagnostic-result.json') + FOCUS_NAMES
          FILES = tuple((REPORTS / name, name) for name in NAMES) + tuple(
              (Path('build/native-frozen150-second/reports') / ('windows-native-scale150-' + suffix),
               'windows-native-frozen150-second-' + suffix) for suffix in SUFFIXES)
          MODE = os.environ.get('VGA_SOURCE_FOCUS_ONLY')
          if MODE not in ('true', 'false'):
              raise SystemExit('Unknown diagnostic mode; no evidence claim can be made')
          SCOPE = (('Source-only focus/routing diagnostic' if MODE == 'true' else 'Source and one fresh frozen EXE diagnostic') +
                   ' on owned synthetic Windows fixtures. '
                   'Selected bounded text evidence only; not complete release acceptance or proof of Run 80 causality.')
          print(SCOPE, flush=True)
          rows, problems, total = [], [], 0
          for path, name in FILES:
              if path.is_symlink():
                  problems.append(name + ': symlink rejected')
                  continue
              if not path.is_file():
                  print(name + ': not produced', flush=True)
                  continue
              size = path.stat().st_size
              total += size
              print('\n' + name + ' (' + str(size) + ' bytes)', flush=True)
              if size > MAX_FILE_BYTES:
                  # Oversize evidence is never uploaded. Keep bounded failure edges.
                  with path.open('rb') as stream:
                      head = stream.read(MAX_PRINT_CHARS)
                      stream.seek(max(0, size - MAX_PRINT_CHARS))
                      tail = stream.read(MAX_PRINT_CHARS)
                  print(head.decode('utf-8', errors='replace'), flush=True)
                  print('\n[bounded log excerpt; middle omitted]\n' + tail.decode('utf-8', errors='replace'), flush=True)
                  problems.append(name + ': exceeds per-file evidence cap')
                  continue
              with path.open('rb') as stream:
                  data = stream.read(MAX_FILE_BYTES + 1)
              if len(data) != size or len(data) > MAX_FILE_BYTES:
                  problems.append(name + ': evidence changed while reading')
                  continue
              if path.suffix == '.json' or len(data) <= 2 * MAX_PRINT_CHARS:
                  # Full bounded JSON preserves causal fields even in the middle.
                  print(data.decode('utf-8', errors='replace'), flush=True)
              else:
                  print(data[:MAX_PRINT_CHARS].decode('utf-8', errors='replace'), flush=True)
                  print('\n[bounded log excerpt; middle omitted]\n' + data[-MAX_PRINT_CHARS:].decode('utf-8', errors='replace'), flush=True)
              rows.append((name, data))
          if total > MAX_TOTAL_BYTES:
              problems.append('Combined evidence exceeds 2 MiB')
          if problems:
              raise SystemExit('; '.join(problems))
          inventory = [dict(name=name, size=len(data), sha256=hashlib.sha256(data).hexdigest()) for name, data in rows]
          summary = dict(scope=SCOPE, source_sha=os.environ['GITHUB_SHA'],
                         mode='source-focus-only' if MODE == 'true' else 'source-and-frozen',
                         run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                         files=inventory, evidence_bytes=total,
                         max_file_bytes=MAX_FILE_BYTES, max_total_bytes=MAX_TOTAL_BYTES)
          encoded = (json.dumps(summary, indent=2) + '\n').encode('utf-8')
          if len(encoded) > 16384 or total + len(encoded) > MAX_TOTAL_BYTES:
              raise SystemExit('Diagnostic inventory or complete staged evidence exceeds its cap')
          STAGE.mkdir(parents=True, exist_ok=False)
          for name, data in rows:
              (STAGE / name).write_bytes(data)
          (STAGE / 'windows-native-source-diagnostic-inventory.json').write_bytes(encoded)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Native Windows source and frozen diagnostic\n\n' + SCOPE + '\n\n')
              output.write('Source SHA: ' + summary['source_sha'] + '\n')
              output.write('Evidence staging does not turn any failed or skipped check into a pass.\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the existing read-only budget against the exact staged text set
        id: evidence_budget
        if: ${{ always() && steps.diagnostic_evidence.outcome == 'success' }}
        env:
          VGA_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: >-
          python -c "import json; from pathlib import Path; from scripts.check_artifact_budget import check_budget; print(json.dumps(check_budget(Path('build/native-source-diagnostic-evidence'), evidence_only=True, output_path='../native-source-diagnostic-budget.json'), indent=2))"
      - name: Retain bounded capture diagnostics for one day only when both budgets pass
        if: ${{ always() && steps.diagnostic_evidence.outcome == 'success' && steps.evidence_budget.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-source-diagnostic-evidence/reports
          if-no-files-found: error
          retention-days: 1
