name: Diagnose exact-wheel capture crossover

# Isolated manual experiment: no EXE, adoption, tag, release, or large artifact.
# The production main-branch workflow is unchanged.
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Must remain false; this branch has no publishing path'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vga-capture-opencv-crossover-diagnostic
  cancel-in-progress: false

jobs:
  capture-crossover:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.repository == 'Junming-Liang/vga-aram-helper' && github.ref == 'refs/heads/experiment/capture-opencv-crossover' && inputs.publish_preview == false }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      ORT_DISABLE_TELEMETRY: '1'
      VGA_RELEASE_PACKAGE_PROFILE: 'minimal-opencv-v1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the same pinned requirements from official PyPI
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force reports | Out-Null
      - name: Test crossover, parity, capture diagnostics and branch restrictions
        env:
          VGA_RELEASE_PACKAGE_PROFILE: ''
        run: |
          python -u -X faulthandler -m unittest discover -s tests -p 'test_opencv*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u -X faulthandler -m unittest discover -s tests -p test_capture_phase_probe.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u -X faulthandler -m unittest discover -s tests -p test_capture_crossover_workflow.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save only the already-approved official wheel version
        run: |
          New-Item -ItemType Directory -Force build/opencv-crossover/official | Out-Null
          python -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --no-deps --dest build/opencv-crossover/official opencv-python-headless==5.0.0.93
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe_opencv_capture_crossover.py prepare
      - name: Install and use approved free Community C++ runtime tooling
        run: ./scripts/install-community-runtime.ps1 -AcceptCommunityLicense
      - name: Build the unchanged strict one-shot helper
        run: python scripts/build_wgc_capture.py
      - name: Build the unchanged strict persistent helper
        run: python scripts/build_wgc_session_capture.py
      - name: Rebuild the same approved custom wheel once
        run: python scripts/build_minimal_opencv.py
      - name: Run fixed offline A1 B1 A2 B2 fresh-process probes and verify final B restoration
        run: python scripts/probe_opencv_capture_crossover.py run
      - name: Always print bounded complete crossover evidence
        if: ${{ always() }}
        run: python scripts/probe_opencv_capture_crossover.py summarize
      - name: Always check the unchanged small-evidence artifact budget
        id: evidence_budget
        if: ${{ always() }}
        run: python scripts/check_artifact_budget.py --evidence-only
      - name: Upload only budgeted diagnostic evidence for one day
        if: ${{ always() && steps.evidence_budget.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-capture-crossover-${{ github.sha }}
          path: reports/windows-*
          if-no-files-found: error
          retention-days: 1
