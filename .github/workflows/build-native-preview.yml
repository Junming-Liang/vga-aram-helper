name: Validate persistent HWND experiment

# This branch-only workflow is a controlled experiment. It cannot publish releases.
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Must remain false: isolated persistent-capture validation never publishes'
        type: boolean
        default: false

permissions: {}
concurrency:
  group: vga-persistent-capture-experiment
  cancel-in-progress: false

jobs:
  persistent-capture-experiment:
    if: ${{ !inputs.publish_preview && github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.repository == 'Junming-Liang/vga-aram-helper' && github.ref == 'refs/heads/experiment/persistent-wgc-session' }}
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
      ORT_DISABLE_TELEMETRY: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install existing pinned build requirements from official PyPI
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force reports | Out-Null
      - name: Run original and experimental WGC protocol and build regressions
        run: python -u -X faulthandler -m unittest discover -s tests -p 'test_wgc*.py' -v
      - name: Install and use approved free Community C++ runtime tooling
        run: ./scripts/install-community-runtime.ps1 -AcceptCommunityLicense
      - name: Build isolated session helper using pinned compiler and SDK
        run: python scripts/build_wgc_session_capture.py
      - name: Require source session pixels and all lifecycle guards at three scales
        run: python tests/windows_wgc_session_capture.py
      - name: Freeze test-only Qt diagnostic without rebuilding tested helper
        run: python scripts/build_wgc_session_capture.py --freeze-only
      - name: Require exact frozen session pixels and guards at three scales
        run: python tests/windows_wgc_session_capture.py --exe dist/wgc-session-diagnostic/WGC-Session-Diagnostic.exe
      - name: Always print complete bounded experiment summary
        if: ${{ always() }}
        run: python tests/windows_wgc_session_capture.py --summarize
      - name: Always enforce small evidence budget
        id: evidence_budget
        if: ${{ always() }}
        run: python scripts/check_artifact_budget.py --evidence-only
      - name: Upload bounded experiment evidence only
        if: ${{ always() && steps.evidence_budget.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-persistent-capture-evidence-${{ github.sha }}
          path: reports/windows-wgc-session*.json
          if-no-files-found: error
          retention-days: 1
