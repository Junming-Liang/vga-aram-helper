name: Build and publish native preview

# Manual validation by default. Publication is a separate explicit final-step choice.
# EXE/source files go directly to Releases; only small evidence is stored in Actions.
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Build, test and publish v0.4.9 as a native overlay PREVIEW prerelease'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: vga-native-preview-v0.4.9
  cancel-in-progress: false

jobs:
  native-preview:
    # Standard GitHub-hosted runner only; this workflow targets the public repo.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.repository == 'Junming-Liang/vga-aram-helper' && github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUTF8: '1'
      ORT_DISABLE_TELEMETRY: '1'
      VGA_RELEASE_PACKAGE_PROFILE: 'minimal-opencv-v1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build requirements from official PyPI
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force reports | Out-Null
          python -m pip freeze | Out-File -Encoding utf8 reports/windows-build-environment.txt
      - name: Python unit tests
        env:
          VGA_RELEASE_PACKAGE_PROFILE: ''
        run: python -u -X faulthandler -m unittest discover -s tests -v
      - name: JavaScript checks
        run: |
          node --check static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/ocr-ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/choices.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_ui_logic.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_choices_ui.js
      - name: Install and use approved free Community C++ runtime tooling
        run: ./scripts/install-community-runtime.ps1 -AcceptCommunityLicense
      - name: Build bounded HWND-only WGC helper with approved compiler
        run: python scripts/build_wgc_capture.py
      - name: Build persistent HWND-only WGC helper with the same approved compiler
        run: python scripts/build_wgc_session_capture.py
      - name: Require real Windows WGC source acceptance at three app scales
        run: python tests/windows_wgc_capture.py --reports reports
      - name: Require application-entrypoint session source acceptance at three app scales
        run: python tests/windows_wgc_session_capture.py --application --reports reports
      - name: Investigate exact owned visible-overlay capture on source at three scales
        run: python tests/windows_wgc_visible_overlay.py --reports reports
      - name: Require source client hero-reference and handoff at three app scales
        run: python tests/windows_selection_smoke.py --report-dir reports
      - name: Test automatic window lifecycle and bounded capture on owned Windows fixtures
        run: python tests/windows_automatic_capture.py --reports reports
      - name: Verify exact-source overlay geometry at five app scales
        run: python tests/windows_dpi_matrix.py --implementation-file native_ui.py --support-root . --report-dir reports --expect candidate
      - name: Preserve the exact official wheel and initial identity before rebuilding
        run: |
          New-Item -ItemType Directory -Force build/opencv-postbuild/official | Out-Null
          python -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --no-deps --dest build/opencv-postbuild/official opencv-python-headless==5.0.0.93
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe_opencv_postbuild.py prepare
      - name: Rebuild adopted hash-pinned OpenCV with the approved Community compiler
        run: python scripts/build_minimal_opencv.py
      - name: Compare one fixed official-to-custom pair after the build and restore exact custom bytes
        run: |
          python scripts/probe_opencv_postbuild.py run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe_opencv_postbuild.py export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 reports/windows-build-environment.txt
      - name: Re-run Python tests with the adopted native library
        env:
          VGA_RELEASE_PACKAGE_PROFILE: ''
        run: python -u -X faulthandler -m unittest discover -s tests -v
      - name: Build single-file EXE with local OCR models
        run: python scripts/build_windows.py
      - name: Require exact frozen EXE WGC acceptance at three app scales
        run: python tests/windows_wgc_capture.py --exe dist/VGA-Aram-Helper.exe --reports reports
      - name: Require exact application EXE session acceptance at three app scales
        run: python tests/windows_wgc_session_capture.py --application --exe dist/VGA-Aram-Helper.exe --reports reports
      - name: Investigate exact owned visible-overlay capture in the frozen product at three scales
        run: python tests/windows_wgc_visible_overlay.py --exe dist/VGA-Aram-Helper.exe --reports reports
      - name: Install mandatory official browser test dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements-browser.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual EXE with every baseline browser and OCR check
        run: python tests/windows_exe_smoke.py --exe dist/VGA-Aram-Helper.exe --browser
      - name: Test actual native overlay against a synthetic mock window
        run: python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe
      - name: Repeat actual EXE native OCR and overlay at 150 percent app scale
        run: python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe --app-scale 1.5
      - name: Repeat actual EXE native OCR and overlay at 200 percent app scale
        run: python tests/windows_native_smoke.py --exe dist/VGA-Aram-Helper.exe --app-scale 2
      - name: Test owned client-to-game screenshot selection handoff
        run: python tests/windows_selection_smoke.py --exe dist/VGA-Aram-Helper.exe
      - name: Test this exact candidate EXE for native OTA success and rollback
        run: |
          $manifest = Get-Content dist/release/update-manifest.json -Raw | ConvertFrom-Json
          python tests/windows_ota_smoke.py --exe dist/VGA-Aram-Helper.exe --expected-sha256 $manifest.sha256 --expected-size $manifest.size --release-source-sha "$env:GITHUB_SHA"
      - name: Verify candidate size evidence and complete image-format coverage
        run: python scripts/check_package_candidate.py
      - name: Always print bounded post-build comparison and restoration evidence
        if: ${{ always() }}
        run: python scripts/probe_opencv_postbuild.py summarize
      - name: Always print bounded application session evidence
        if: ${{ always() }}
        run: python tests/windows_wgc_session_capture.py --application --summarize --reports reports
      - name: Always check the small-evidence artifact budget
        id: evidence_budget
        if: ${{ always() }}
        run: python scripts/check_artifact_budget.py --evidence-only
      - name: Verify fresh native preview, source licenses and exact tested bytes
        if: ${{ success() }}
        run: >-
          python scripts/verify_release.py
          --release-dir dist/release --evidence-dir reports --output-dir build/verified-preview
          --repository "$env:GITHUB_REPOSITORY" --source-sha "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT"
      - name: Upload only small test evidence when its budget passed
        if: ${{ always() && steps.evidence_budget.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-evidence-${{ github.sha }}
          path: |
            reports/windows-*
            reports/hero-recognition-genuine.json
            reports/champion-select-genuine.json
          if-no-files-found: error
          retention-days: 1
      - name: Write run summary
        if: ${{ always() }}
        run: |
          '## Windows EXE verification' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path reports/windows-opencv-parity.json) {
            Get-Content reports/windows-opencv-parity.json >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path reports/windows-package-size.json) {
            Get-Content reports/windows-package-size.json >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path reports/windows-exe-smoke.json) {
            Get-Content reports/windows-exe-smoke.json >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Actual EXE smoke test did not complete; do not treat this build as verified.' >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path dist/release/SHA256SUMS.txt) {
            Get-Content dist/release/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path reports/windows-native-smoke.json) {
            Get-Content reports/windows-native-smoke.json >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Native overlay verification did not complete; do not treat this build as verified.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Create verified draft and publish its ID only as a non-latest prerelease
        if: ${{ success() && inputs.publish_preview }}
        # Only the final publishing step maps the ephemeral token into an environment.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: >-
          python scripts/verify_release.py
          --release-dir dist/release --evidence-dir reports --output-dir build/verified-preview
          --repository "$env:GITHUB_REPOSITORY" --source-sha "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --publish
